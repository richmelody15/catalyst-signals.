name: Keep Alive

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://catalyst-backend.onrender.com/health)
          echo "Ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Backend returned $STATUS (may be waking up)"
          fi
